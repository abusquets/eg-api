services:
  api-pro:
    container_name: eventsguard_api_pro
    build:
      args:
        SERVICE: api
      context: .
      target: prod
    image: eventsguard_app
    command: ["/prod/go-events-guard", "server"]

    volumes:
      - .:/app:cached
      - go_cache:/go/pkg/mod:delegated

    ports:
      - 8082:8080
    environment:
      - SERVER_PORT=8080
      - SERVER_URI=/eg-api
    healthcheck:
      test: ["CMD", "go", "run", "-exec", "package main; import (\"net/http\"; \"os\"; \"time\"); func main() { client := http.Client{Timeout: 30 * time.Second}; resp, err := client.Get(\"http://localhost/health\"); if err != nil || resp.StatusCode != http.StatusOK { os.Exit(1) }; os.Exit(0) }"]
      interval: 10s
      timeout: 30s
      retries: 3
    networks:
      - eventsguard-network

  webserver:
      container_name: eventsguard_webserver
      image: caddy:2.4.5
      ports:
        - 8083:80
      volumes:
        - ./docker/Caddyfile:/etc/caddy/Caddyfile
      networks:
        - eventsguard-network


volumes:
  go_cache:

networks:
  eventsguard-network:
    external: true
