root = "."
tmp_dir = "tmp"


[build]
  cmd = "go build -o ./tmp/api-main ./main.go"
  bin = "./tmp/api-main"
  args_bin = ["server"]

  delay = 1000
  # colima --> doesn't work without this
  poll = true
  poll_interval = 500
  # colima <--
  exclude_dir = ["assets", "tmp", "vendor", "docker", "bin"]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false
