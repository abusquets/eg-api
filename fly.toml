# fly.toml app configuration file generated for events-guard on 2025-02-09T06:23:24+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'events-guard'
primary_region = 'mad'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'prod'


[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  SERVER_PORT = '8000'
