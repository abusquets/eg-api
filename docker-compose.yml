services:
  api:
    container_name: eventsguard_api
    build:
      args:
        SERVICE: api
      context: .
      target: dev
    image: eventsguard_app
    command: ["air"]

    volumes:
      - .:/app:cached
      - go_cache:/go/pkg/mod:delegated

    ports:
      - 8080:8080
    environment:
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "go", "run", "-exec", "package main; import (\"net/http\"; \"os\"; \"time\"); func main() { client := http.Client{Timeout: 30 * time.Second}; resp, err := client.Get(\"http://localhost/health\"); if err != nil || resp.StatusCode != http.StatusOK { os.Exit(1) }; os.Exit(0) }"]
      interval: 10s
      timeout: 30s
      retries: 3
    networks:
      - eventsguard-network

volumes:
  go_cache:


networks:
  eventsguard-network:
    external: true
